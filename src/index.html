<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Planner 2</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="panel">

<div class="panel-title">
<h1>Project Planner</h1>
<h2>FERTILISER FUNNEL</h2>
</div>

<div class="panel-actions">
<div class="action-buttons">

  <!-- DEV NOTE: this button opens the BRIEF page. -->

     <button id="read-brief-button" class="action-button" type="button">BRIEF</button>
</div>
</div>

<div class="panel-steps">
<div class="step-buttons">
<button class="step-button" type="button">STEP 1</button>
<button class="step-button" type="button">STEP 2</button>
<button class="step-button" type="button">STEP 3</button>
<button class="step-button" type="button">STEP 4</button>
<button class="step-button" type="button">STEP 5</button>
</div>
</div>

</div>  <!--- CLOSE PANEL -->

<div class="container" id="container"></div>  <!--- steps are built into here by the script -->

<script src="script.js"></script>

</body>
</html>
